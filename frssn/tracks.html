<!-- SCRATCH -->
<input
  id="scratchSensitivity"
  type="range"
  min="0.02"
  max="2.00"
  step="0.01"
  value="0.54"
>

<!-- MOTOR RECOVERY -->
<input
  id="motorRecoverySpeed"
  type="range"
  min="0.20"
  max="3.00"
  step="0.05"
  value="3.00"
>

<!-- SEEK START -->
<input
  id="seekStartSpeed"
  type="range"
  min="0.20"
  max="4.00"
  step="0.05"
  value="4.00"
>

<!-- SEEK RETURN -->
<input
  id="seekStopSpeed"
  type="range"
  min="0.20"
  max="4.00"
  step="0.05"
  value="1.00"
>

<!-- PLAY START -->
<input
  id="playStartSpeed"
  type="range"
  min="0.20"
  max="4.00"
  step="0.05"
  value="3.55"
>
