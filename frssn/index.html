<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>FRSSN Signal</title>

  <style>
    :root {
      --bg: #050605;
      --panel: rgba(11, 13, 11, 0.92);
      --panel-hover: rgba(20, 24, 16, 0.96);

      --accent: #d6ff28;
      --accent-line: rgba(214, 255, 40, 0.42);

      --text: #f3f4ef;
      --muted: #90948a;

      --border: rgba(255, 255, 255, 0.2);

      --content-width: 1480px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100svh;
      margin: 0;

      color: var(--text);

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle at 50% 18%,
          rgba(214, 255, 40, 0.08),
          transparent 34%
        ),
        var(--bg);

      background-size:
        48px 48px,
        48px 48px,
        auto,
        auto;

      font-family:
        "Arial Narrow",
        "Roboto Condensed",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      z-index: 20;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 4px
        );

      opacity: 0.6;
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      z-index: 19;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0, 0, 0, 0.62) 100%
        );
    }

    a {
      color: inherit;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .page {
      width: min(
        var(--content-width),
        calc(100% - 72px)
      );

      min-height: 100svh;

      margin: 0 auto;
      padding: 32px 0 24px;

      position: relative;
      z-index: 2;

      display: grid;

      grid-template-rows:
        auto
        1fr
        auto;
    }


    /* =========================================================
       TOPBAR
       ========================================================= */

    .topbar {
      min-height: 44px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 24px;

      color: var(--muted);

      font-family: monospace;
      font-size: 11px;

      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .topbar__brand {
      color: var(--accent);
    }

    .topbar__status {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 12px var(--accent);

      animation:
        pulse 1.8s ease-in-out infinite;
    }

    .topbar__status.is-lost {
      color: var(--accent);
    }


    /* =========================================================
       MAIN
       ========================================================= */

    .main {
      padding: 48px 0;

      display: grid;

      grid-template-columns:
        minmax(380px, 0.9fr)
        minmax(620px, 1.35fr);

      align-items: center;

      gap:
        clamp(
          52px,
          7vw,
          120px
        );
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      text-align: center;
    }

    .signal-label {
      margin:
        0
        0
        22px;

      color: var(--muted);

      font-family: monospace;
      font-size: 10px;

      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;

      font-size:
        clamp(
          96px,
          10vw,
          178px
        );

      font-weight: 800;

      line-height: 0.82;

      letter-spacing: 0.07em;

      text-shadow:
        3px 0 0 rgba(255,255,255,0.04),
        -2px 0 0 rgba(214,255,40,0.08);
    }

    .hero h1::after {
      content: "";

      width: 100%;
      height: 2px;

      position: absolute;

      top: 42%;
      left: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );

      opacity: 0.12;
    }

    .hero__signal {
      margin:
        28px
        0
        0;

      color: var(--accent);

      font-family: monospace;

      font-size:
        clamp(
          19px,
          2vw,
          30px
        );

      letter-spacing: 0.7em;
      text-indent: 0.7em;
    }


    /* =========================================================
       SIGNAL WAVE BUTTON
       ========================================================= */

    .wave {
      width: 88px;
      height: 56px;

      margin:
        22px
        auto
        0;

      padding: 0;

      border: 0;

      background: transparent;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 4px;

      cursor: pointer;
    }

    .wave span {
      width: 2px;
      height: 8px;

      display: block;

      background: var(--accent);

      box-shadow:
        0 0 8px rgba(214,255,40,0.4);

      animation:
        wave 1.1s ease-in-out infinite;

      transition:
        box-shadow 180ms ease,
        opacity 180ms ease;
    }

    .wave:hover span {
      opacity: 1;

      box-shadow:
        0 0 16px rgba(214,255,40,0.95);
    }

    .wave.is-playing span {
      animation-duration: 0.55s;

      box-shadow:
        0 0 18px rgba(214,255,40,1);
    }

    .wave.is-lost {
      cursor: default;
    }

    .wave.is-lost span {
      opacity: 0.22;

      animation-duration: 2.2s;

      box-shadow:
        0 0 5px rgba(214,255,40,0.25);
    }

    .wave span:nth-child(2) {
      height: 18px;
      animation-delay: 0.1s;
    }

    .wave span:nth-child(3) {
      height: 32px;
      animation-delay: 0.2s;
    }

    .wave span:nth-child(4) {
      height: 16px;
      animation-delay: 0.3s;
    }

    .wave span:nth-child(5) {
      height: 42px;
      animation-delay: 0.4s;
    }

    .wave span:nth-child(6) {
      height: 24px;
      animation-delay: 0.5s;
    }

    .wave span:nth-child(7) {
      height: 12px;
      animation-delay: 0.6s;
    }

    .hero__description {
      max-width: 500px;

      margin:
        10px
        auto
        0;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.8;

      letter-spacing: 0.38em;
      text-transform: uppercase;
    }


    /* =========================================================
       PLATFORM GRID
       ========================================================= */

    .platforms {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(250px, 1fr)
        );

      gap: 18px;
    }

    .platform {
      width: 100%;

      min-height: 230px;

      padding: 28px;

      position: relative;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      color: var(--text);

      border:
        1px
        solid
        var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.04),
          transparent 42%
        ),
        var(--panel);

      text-align: center;
      text-decoration: none;

      clip-path:
        polygon(
          0 0,
          calc(100% - 20px) 0,
          100% 20px,
          100% 100%,
          20px 100%,
          0 calc(100% - 20px)
        );

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease,
        opacity 180ms ease,
        filter 180ms ease;
    }

    .platform:hover {
      transform:
        translateY(-5px);

      border-color:
        var(--accent-line);

      background:
        var(--panel-hover);

      box-shadow:
        inset
        0
        0
        30px
        rgba(214,255,40,0.035),

        0
        15px
        40px
        rgba(0,0,0,0.35);
    }

    .platform--primary {
      border-color:
        var(--accent);
    }

    .node-label {
      position: absolute;

      top: 16px;
      left: 18px;

      color: var(--muted);

      font-family: monospace;
      font-size: 9px;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .platform--primary .node-label {
      color: var(--accent);
    }


    /* =========================================================
       PLATFORM ICONS
       ========================================================= */

    .platform__icon {
      width: 72px;
      height: 72px;

      margin-bottom: 20px;

      display: grid;

      place-items: center;

      position: relative;

      border:
        1px
        solid
        rgba(255,255,255,0.12);

      font-size: 30px;
      font-weight: 900;
    }


    /* BEATSTORE */

    .icon-store {
      color: #101308;

      background:
        var(--accent);
    }


    /* YOUTUBE */

    .icon-youtube {
      color: white;

      border-radius: 18px;

      background:
        #f32020;
    }


    /* =========================================================
       SEALED LOCK ICON
       Pure CSS — no image
       ========================================================= */

    .icon-lock {
      border-color:
        rgba(214,255,40,0.18);

      background:
        rgba(214,255,40,0.025);

      box-shadow:
        inset
        0
        0
        28px
        rgba(214,255,40,0.025);
    }

    /* BODY */

    .icon-lock::before {
      content: "";

      position: absolute;

      width: 28px;
      height: 21px;

      left: 50%;
      top: 34px;

      transform:
        translateX(-50%);

      border:
        2px
        solid
        rgba(214,255,40,0.72);

      border-radius: 3px;

      background:
        rgba(214,255,40,0.035);

      box-shadow:
        0 0 11px rgba(214,255,40,0.06),
        inset 0 0 9px rgba(214,255,40,0.04);
    }

    /* SHACKLE */

    .icon-lock::after {
      content: "";

      position: absolute;

      width: 18px;
      height: 17px;

      left: 50%;
      top: 18px;

      transform:
        translateX(-50%);

      border:
        2px
        solid
        rgba(214,255,40,0.72);

      border-bottom: 0;

      border-radius:
        14px
        14px
        0
        0;
    }


    /* =========================================================
       PLATFORM TEXT
       ========================================================= */

    .platform strong {
      display: block;

      color: var(--accent);

      font-size: 19px;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .platform p {
      max-width: 220px;

      margin:
        11px
        0
        0;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;
    }

    .arrow {
      position: absolute;

      right: 20px;
      bottom: 17px;

      color: var(--accent);

      font-size: 28px;
    }


    /* =========================================================
       LOCKED NODES
       ========================================================= */

    button.platform {
      appearance: none;

      font: inherit;

      cursor: pointer;
    }

    .platform--locked {
      opacity: 0.56;

      filter:
        grayscale(0.55)
        saturate(0.32);
    }

    .platform--locked:hover {
      opacity: 0.84;

      filter:
        grayscale(0.18)
        saturate(0.55);

      transform:
        translateY(-3px);
    }

    .platform--locked::after {
      content: "LOCKED";

      position: absolute;

      top: 17px;
      right: 18px;

      color: var(--accent);

      font-family: monospace;

      font-size: 8px;

      letter-spacing: 0.2em;

      opacity: 0.52;

      pointer-events: none;
    }

    .platform--locked .node-label {
      color:
        rgba(
          214,
          255,
          40,
          0.52
        );
    }

    .platform--locked .platform__icon {
      opacity: 0.7;
    }

    .platform--locked strong {
      color:
        rgba(
          214,
          255,
          40,
          0.7
        );
    }

    .platform--locked .arrow {
      opacity: 0.42;
    }

    .platform--locked:hover .arrow {
      opacity: 0.72;
    }

    .platform--locked:hover .icon-lock {
      border-color:
        rgba(214,255,40,0.32);

      box-shadow:
        inset
        0
        0
        30px
        rgba(214,255,40,0.045),

        0
        0
        18px
        rgba(214,255,40,0.035);
    }

    .platform--locked:hover .icon-lock::before,
    .platform--locked:hover .icon-lock::after {
      border-color:
        rgba(214,255,40,0.95);
    }

    .platform--locked.is-hit {
      animation:
        locked-hit 190ms steps(2, end);
    }

    .platform--locked.is-hit::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      background:
        linear-gradient(
          transparent 0%,
          transparent 40%,
          rgba(214,255,40,0.11) 41%,
          transparent 44%,
          transparent 63%,
          rgba(255,255,255,0.08) 64%,
          transparent 67%
        );

      animation:
        lock-scan 220ms steps(2, end);
    }

    .platform--locked.is-hit strong {
      text-shadow:
        -3px 0 rgba(214,255,40,0.35),
        3px 0 rgba(255,255,255,0.15);
    }

    .platform--locked.is-hit .icon-lock {
      border-color:
        rgba(214,255,40,0.7);

      box-shadow:
        0 0 24px
        rgba(214,255,40,0.09);
    }

    .locked-status {
      font-family: monospace;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      min-height: 50px;

      padding-top: 18px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 24px;

      border-top:
        1px
        solid
        rgba(214,255,40,0.16);

      color: var(--muted);

      font-family: monospace;

      font-size: 10px;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .footer__links {
      display: flex;

      gap: 20px;
    }

    .footer a {
      color: var(--muted);

      text-decoration: none;
    }

    .footer a:hover {
      color: var(--accent);
    }


    /* =========================================================
       SIGNAL CODE PANEL
       ========================================================= */

    .code-panel {
      width:
        min(
          420px,
          100%
        );

      margin:
        28px
        auto
        0;

      padding: 14px;

      border:
        1px
        solid
        rgba(214,255,40,0.24);

      background:
        rgba(
          7,
          9,
          7,
          0.72
        );

      box-shadow:
        inset
        0
        0
        24px
        rgba(214,255,40,0.025);

      text-align: left;
    }

    .code-panel__label {
      display: block;

      margin-bottom: 8px;

      color: var(--muted);

      font-family: monospace;

      font-size: 9px;

      letter-spacing: 0.2em;

      text-transform: uppercase;
    }

    .code-panel__row {
      display: grid;

      grid-template-columns:
        1fr
        auto;

      gap: 8px;
    }

    .code-panel__input {
      min-width: 0;

      height: 42px;

      padding:
        0
        12px;

      color: var(--accent);

      border:
        1px
        solid
        rgba(255,255,255,0.16);

      outline: none;

      background: #070907;

      font-family: monospace;

      font-size: 15px;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      caret-color: var(--accent);
    }

    .code-panel__input:focus {
      border-color: var(--accent);

      box-shadow:
        0
        0
        0
        1px
        rgba(214,255,40,0.14),

        0
        0
        18px
        rgba(214,255,40,0.06);
    }

    .code-panel__button {
      height: 42px;

      padding:
        0
        14px;

      color: #0a0c08;

      border:
        1px
        solid
        var(--accent);

      background:
        var(--accent);

      font-family: monospace;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      cursor: pointer;
    }

    .code-panel__button:hover {
      filter:
        brightness(1.08);

      box-shadow:
        0
        0
        16px
        rgba(214,255,40,0.18);
    }

    .code-panel__status {
      min-height: 18px;

      margin:
        9px
        0
        0;

      color: var(--muted);

      font-family: monospace;

      font-size: 9px;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    .code-panel__status.is-valid {
      color: var(--accent);
    }

    .code-panel__status.is-invalid {
      color: #b9bdaf;
    }


    /* =========================================================
       ANIMATIONS
       ========================================================= */

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.45;

        transform:
          scale(0.9);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.15);
      }
    }

    @keyframes wave {
      0%,
      100% {
        transform:
          scaleY(0.45);

        opacity: 0.45;
      }

      50% {
        transform:
          scaleY(1);

        opacity: 1;
      }
    }

    @keyframes locked-hit {
      0% {
        transform:
          translateX(0);
      }

      20% {
        transform:
          translateX(-4px);
      }

      40% {
        transform:
          translateX(4px);
      }

      60% {
        transform:
          translateX(-2px);
      }

      80% {
        transform:
          translateX(2px);
      }

      100% {
        transform:
          translateX(0);
      }
    }

    @keyframes lock-scan {
      0% {
        transform:
          translateY(-20%);
      }

      50% {
        transform:
          translateY(8%);
      }

      100% {
        transform:
          translateY(20%);
      }
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1050px) {
      .page {
        width:
          min(
            760px,
            calc(100% - 40px)
          );
      }

      .main {
        padding:
          64px
          0;

        grid-template-columns:
          1fr;

        gap: 56px;
      }

      .hero h1 {
        font-size:
          clamp(
            94px,
            18vw,
            150px
          );
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 640px) {
      .page {
        width:
          min(
            calc(100% - 28px),
            440px
          );

        padding-top:
          max(
            20px,
            env(safe-area-inset-top)
          );

        padding-bottom:
          max(
            20px,
            env(safe-area-inset-bottom)
          );
      }

      .topbar {
        font-size: 9px;

        letter-spacing: 0.12em;
      }

      .main {
        padding:
          54px
          0
          34px;

        grid-template-columns:
          1fr;

        gap: 42px;
      }

      .signal-label {
        font-size: 9px;
      }

      .hero h1 {
        font-size:
          clamp(
            70px,
            23vw,
            104px
          );
      }

      .hero__signal {
        margin-top: 20px;

        font-size: 17px;

        letter-spacing: 0.5em;

        text-indent: 0.5em;
      }

      .wave {
        height: 44px;

        margin-top: 14px;
      }

      .hero__description {
        font-size: 9px;

        line-height: 1.9;

        letter-spacing: 0.25em;
      }

      .platforms {
        grid-template-columns:
          1fr;

        gap: 14px;
      }

      .platform {
        min-height: 142px;

        padding:
          26px
          48px
          22px
          20px;

        flex-direction: row;

        justify-content: flex-start;

        text-align: left;
      }

      .node-label {
        top: 10px;
        left: auto;
        right: 14px;

        font-size: 7px;
      }

      .platform--locked::after {
        top: auto;
        bottom: 10px;
        right: 14px;

        font-size: 7px;
      }

      .platform__icon {
        width: 62px;
        height: 62px;

        margin:
          0
          22px
          0
          0;

        flex:
          0
          0
          62px;

        font-size: 25px;
      }

      .icon-lock::before {
        width: 25px;
        height: 19px;

        top: 30px;
      }

      .icon-lock::after {
        width: 16px;
        height: 15px;

        top: 15px;
      }

      .platform strong {
        font-size: 16px;
      }

      .platform p {
        margin-top: 7px;

        font-size: 13px;
      }

      .arrow {
        right: 16px;

        bottom: auto;
        top: 50%;

        transform:
          translateY(-50%);
      }

      .footer {
        padding-top: 22px;

        flex-direction: column;

        justify-content: center;

        gap: 13px;

        text-align: center;
      }
    }
  </style>
</head>


<body>

  <div class="page">


    <!-- =====================================================
         TOPBAR
         ===================================================== -->

    <header class="topbar">

      <span class="topbar__brand">
        FRSSN SIGNAL // NODE 001
      </span>

      <span
        class="topbar__status"
        id="signalStatus"
      >

        <span
          class="status-dot"
          aria-hidden="true"
        ></span>

        <span id="signalStatusText">
          Online
        </span>

      </span>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


      <!-- ===================================================
           HERO
           =================================================== -->

      <section
        class="hero"
        aria-labelledby="page-title"
      >

        <p class="signal-label">
          Connection stable · Signal detected
        </p>

        <h1 id="page-title">
          FRSSN
        </h1>

        <p class="hero__signal">
          SIGNAL
        </p>


        <!-- SIGNAL AUDIO BUTTON -->

        <button

  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>
    "use strict";


    /* =======================================================
       ELEMENTS
       ======================================================= */

    const yearElement =
      document.getElementById("year");

    const signalButton =
      document.getElementById("signalButton");

    const signalAudio =
      document.getElementById("signalAudio");

    const signalStatus =
      document.getElementById("signalStatus");

    const signalStatusText =
      document.getElementById("signalStatusText");

    const signalCodeForm =
      document.getElementById("signalCodeForm");

    const signalCodeInput =
      document.getElementById("signalCodeInput");

    const signalCodeStatus =
      document.getElementById("signalCodeStatus");


    /* =======================================================
       YEAR
       ======================================================= */

    if (yearElement) {
      yearElement.textContent =
        new Date().getFullYear();
    }


    /* =======================================================
       ARG CODES
       ======================================================= */

    const ARG_CODES = {

      "∴∆Ξ": {
        message:
          "SIGNAL ACCEPTED // NODE UNLOCKED"
      }

    };


    function normalizeSignalCode(value) {

      return value
        .trim()
        .replace(/\s+/g, "");

    }


    if (
      signalCodeForm &&
      signalCodeInput &&
      signalCodeStatus
    ) {

      signalCodeForm.addEventListener(
        "submit",
        (event) => {

          event.preventDefault();

          const code =
            normalizeSignalCode(
              signalCodeInput.value
            );

          signalCodeStatus
            .classList
            .remove(
              "is-valid",
              "is-invalid"
            );


          if (!code) {

            signalCodeStatus.textContent =
              "WAITING FOR INPUT";

            return;

          }


          if (ARG_CODES[code]) {

            signalCodeStatus.textContent =
              ARG_CODES[code].message;

            signalCodeStatus
              .classList
              .add("is-valid");

            signalStatusText.textContent =
              "Signal accepted";

            signalStatus
              .classList
              .remove("is-lost");

            localStorage.setItem(
              "frssnArgCode",
              code
            );

          } else {

            signalCodeStatus.textContent =
              "UNKNOWN SIGNAL";

            signalCodeStatus
              .classList
              .add("is-invalid");

          }

        }
      );

    }


    /* =======================================================
       SIGNAL RANDOM CYCLE
       ======================================================= */

    const signalCycle = [

      {
        src: "./signal-01-main.mp3",
        mode: "single",
        endStatus: "Signal lost"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-03-phone.mp3",
        mode: "single",
        endStatus: "Signal lost"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-04-beat.mp3",
        intro: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal detected"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      },

      {
        src: "./signal-02-noise.mp3",
        mode: "repeatable",
        endStatus: "Signal unavailable"
      }

    ];


    const visitCount =
      Number(
        localStorage.getItem(
          "frssnSignalVisit"
        ) || "0"
      );


    const cycleIndex =
      visitCount %
      signalCycle.length;


    const currentSignal =
      signalCycle[cycleIndex];


    localStorage.setItem(
      "frssnSignalVisit",
      String(
        visitCount + 1
      )
    );


    let signalUsed = false;


    function setStatus(text) {

      if (
        !signalStatus ||
        !signalStatusText
      ) {
        return;
      }

      signalStatus
        .classList
        .add("is-lost");

      signalStatusText.textContent =
        text;

    }


    function setSignalEnded() {

      if (!signalButton) {
        return;
      }

      signalButton
        .classList
        .remove("is-playing");


      if (
        currentSignal.mode ===
        "single"
      ) {

        signalButton
          .classList
          .add("is-lost");

        signalButton.setAttribute(
          "aria-label",
          "FRSSN signal lost"
        );

      }


      setStatus(
        currentSignal.endStatus
      );

    }


    /* =======================================================
       SIGNAL AUDIO PLAYER
       ======================================================= */

    if (
      signalButton &&
      signalAudio
    ) {

      let beatIntroPlayed = false;
      let playingIntro = false;


      signalAudio.src =
        currentSignal.intro ||
        currentSignal.src;

      signalAudio.load();


      signalButton.addEventListener(
        "click",
        async () => {

          if (
            currentSignal.mode ===
              "single" &&
            signalUsed
          ) {
            return;
          }


          if (!signalAudio.paused) {
            return;
          }


          if (
            currentSignal.mode ===
            "single"
          ) {
            signalUsed = true;
          }


          try {

            signalButton
              .classList
              .add("is-playing");


            if (
              currentSignal.intro &&
              !beatIntroPlayed
            ) {

              playingIntro = true;
              beatIntroPlayed = true;

              signalAudio.src =
                currentSignal.intro;

            } else {

              playingIntro = false;

              signalAudio.src =
                currentSignal.src;

            }


            signalAudio.currentTime = 0;

            await signalAudio.play();


          } catch (error) {

            if (
              currentSignal.mode ===
              "single"
            ) {
              signalUsed = false;
            }


            playingIntro = false;


            console.warn(
              "FRSSN audio error:",
              error
            );


            alert(
              "Аудіо не знайдено. Перевір файли signal-01-main.mp3, signal-02-noise.mp3, signal-03-phone.mp3, signal-04-beat.mp3 поруч з index.html"
            );

          }

        }
      );


      signalAudio.addEventListener(
        "ended",
        async () => {

          if (
            playingIntro &&
            currentSignal.intro
          ) {

            try {

              playingIntro = false;

              signalAudio.src =
                currentSignal.src;

              signalAudio.currentTime =
                0;

              await signalAudio.play();

              return;


            } catch (error) {

              console.warn(
                "FRSSN beat audio error:",
                error
              );

              signalButton
                .classList
                .remove("is-playing");

              setStatus(
                "Signal unavailable"
              );

              return;

            }

          }


          signalAudio.currentTime = 0;

          signalButton
            .classList
            .remove("is-playing");


          if (
            currentSignal.mode ===
            "repeatable"
          ) {

            signalUsed = false;

            setStatus(
              currentSignal.endStatus
            );

            return;

          }


          setSignalEnded();

        }
      );


      signalAudio.addEventListener(
        "error",
        () => {

          console.warn(
            "Audio file failed to load:",
            signalAudio.currentSrc ||
            currentSignal.src
          );

        }
      );

    }


    /* =======================================================
       SEALED NODE AUDIO
       Synthesized directly in browser
       ======================================================= */

    let lockedAudioContext = null;


    function playLockedNodeSound() {

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;


      if (!AudioCtx) {
        return;
      }


      if (!lockedAudioContext) {

        lockedAudioContext =
          new AudioCtx();

      }


      const ctx =
        lockedAudioContext;


      if (
        ctx.state ===
        "suspended"
      ) {
        ctx.resume();
      }


      const now =
        ctx.currentTime;


      const duration =
        0.24;


      /* STATIC */

      const noiseBuffer =
        ctx.createBuffer(
          1,
          Math.floor(
            ctx.sampleRate *
            duration
          ),
          ctx.sampleRate
        );


      const noiseData =
        noiseBuffer
          .getChannelData(0);


      for (
        let i = 0;
        i < noiseData.length;
        i++
      ) {

        const fade =
          1 -
          i /
          noiseData.length;

        noiseData[i] =
          (
            Math.random() *
            2 -
            1
          ) *
          fade;

      }


      const noise =
        ctx.createBufferSource();

      noise.buffer =
        noiseBuffer;


      const filter =
        ctx.createBiquadFilter();

      filter.type =
        "bandpass";

      filter.frequency.value =
        900;

      filter.Q.value =
        1.4;


      const noiseGain =
        ctx.createGain();


      noiseGain.gain.setValueAtTime(
        0.0001,
        now
      );


      noiseGain.gain.exponentialRampToValueAtTime(
        0.14,
        now + 0.012
      );


      noiseGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
      );


      noise.connect(filter);

      filter.connect(noiseGain);

      noiseGain.connect(
        ctx.destination
      );


      /* LOW LOCK HIT */

      const osc =
        ctx.createOscillator();

      const oscGain =
        ctx.createGain();


      osc.type =
        "square";


      osc.frequency.setValueAtTime(
        95,
        now
      );


      osc.frequency.exponentialRampToValueAtTime(
        47,
        now + 0.13
      );


      oscGain.gain.setValueAtTime(
        0.075,
        now
      );


      oscGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.15
      );


      osc.connect(
        oscGain
      );


      oscGain.connect(
        ctx.destination
      );


      /* HIGH DIGITAL CLICK */

      const click =
        ctx.createOscillator();

      const clickGain =
        ctx.createGain();


      click.type =
        "square";


      click.frequency.setValueAtTime(
        1700,
        now
      );


      clickGain.gain.setValueAtTime(
        0.025,
        now
      );


      clickGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.035
      );


      click.connect(
        clickGain
      );


      clickGain.connect(
        ctx.destination
      );


      noise.start(now);
      osc.start(now);
      click.start(now);


      noise.stop(
        now + duration
      );

      osc.stop(
        now + 0.15
      );

      click.stop(
        now + 0.04
      );

    }


    /* =======================================================
       SEALED NODE INTERACTION
       ======================================================= */

    const lockedNodes =
      document.querySelectorAll(
        "[data-locked-node]"
      );


    lockedNodes.forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            playLockedNodeSound();


            /* Restart glitch */

            button
              .classList
              .remove("is-hit");

            void button.offsetWidth;

            button
              .classList
              .add("is-hit");


            const status =
              button.querySelector(
                ".locked-status"
              );


            if (!status) {
              return;
            }


            const originalText =
              status.textContent;


            status.textContent =
              "NO ROUTE // SIGNAL CLOSED";


            window.setTimeout(
              () => {

                status.textContent =
                  originalText;

                button
                  .classList
                  .remove("is-hit");

              },
              1200
            );

          }
        );

      }
    );

  </script>
